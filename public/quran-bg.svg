<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 700" fill="none">
  <defs>
    <radialGradient id="glow" cx="50%" cy="42%" r="55%">
      <stop offset="0%" stop-color="#e8cf8a" stop-opacity="0.55"/>
      <stop offset="55%" stop-color="#c7a14a" stop-opacity="0.16"/>
      <stop offset="100%" stop-color="#c7a14a" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="gold" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#f1e3b8"/>
      <stop offset="100%" stop-color="#c7a14a"/>
    </linearGradient>
  </defs>

  <circle cx="450" cy="300" r="320" fill="url(#glow)"/>

  <!-- crescent moon -->
  <path d="M700 90c-38-10-66 20-66 56 0 38 30 66 66 66 10 0 20-2 28-6-16 20-40 32-68 32-46 0-84-38-84-84s38-84 84-84c16 0 30 4 40 20z" fill="url(#gold)" opacity="0.5"/>
  <!-- stars -->
  <g fill="url(#gold)" opacity="0.5">
    <circle cx="620" cy="70" r="3.5"/>
    <circle cx="760" cy="150" r="2.5"/>
    <circle cx="180" cy="90" r="2.5"/>
    <circle cx="120" cy="180" r="3"/>
    <circle cx="800" cy="230" r="2"/>
  </g>

  <!-- book stand (rehal) -->
  <g stroke="url(#gold)" stroke-width="3" opacity="0.55" stroke-linecap="round">
    <path d="M330 560 L450 470 L570 560"/>
    <path d="M330 560 L570 560"/>
    <path d="M450 470 L450 600"/>
    <path d="M300 600 L600 600"/>
