    <path d="M450 192 C 448 280 448 410 450 498" stroke="url(#gold)" stroke-width="3" opacity="0.7"/>

    <!-- text lines, left page -->
    <g stroke="url(#gold)" stroke-width="2.5" stroke-linecap="round" opacity="0.55">
      <path d="M320 250 L410 244"/>
      <path d="M312 275 L415 269"/>
      <path d="M308 300 L418 296"/>
      <path d="M306 325 L420 322"/>
      <path d="M308 350 L418 348"/>
      <path d="M312 375 L415 374"/>
      <path d="M318 400 L410 400"/>
      <path d="M326 425 L404 425"/>
    </g>

    <!-- text lines, right page -->
    <g stroke="url(#gold)" stroke-width="2.5" stroke-linecap="round" opacity="0.55">
      <path d="M580 250 L490 244"/>
      <path d="M588 275 L485 269"/>
      <path d="M592 300 L482 296"/>
      <path d="M594 325 L480 322"/>
      <path d="M592 350 L482 348"/>
      <path d="M588 375 L485 374"/>
      <path d="M582 400 L490 400"/>
      <path d="M574 425 L496 425"/>
